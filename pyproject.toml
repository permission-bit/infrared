[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "infrared"
version = "0.1.0"
description = "A Python utility library"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Vincent"}
]

dependencies = [cryptography]

[tool.setuptools.packages.find]
where = ["src"]