[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vincisex"
version = "0.1.17"
description = "Python utility and cryptography library"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vincent" }
]

dependencies = [
    "cryptography>=45.0.0",
    "qrcode",
    "browser_cookie3",
    "flask"
]

[tool.setuptools.packages.find]
where = ["src"]